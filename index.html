<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>User Meta Research Dashboard</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafd;
      margin: 0;
      padding: 0 10vw 4em 10vw;
    }
    h1 { margin-top: 2rem; text-align:center; }
    #status {
      margin: 1em auto;
      max-width: 650px;
      background: #fffbe5;
      border-left: 4px solid #ffe484;
      padding: 1em;
      border-radius: 8px;
      font-size:1.08em;
      min-height: 2.2em;
    }
    #results {
      margin: 2em auto;
      max-width: 900px;
    }
    .record {
      background: #fbfbfe;
      margin-bottom: .7em;
      padding: 1em;
      border-radius: 8px;
      border: 1px solid #e6e8fa;
      box-shadow: 0 2px 12px #e9ebfa42;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }
    .record.selected {
      border-color: #6f8cff;
      background: #e8eeff;
      box-shadow: 0 2px 24px #bfcfff5e;
    }
    .score {
      font-weight: bold;
      float: right;
      color: #4b6eb9;
      margin-top: 0.05em;
    }
    #analyze-llm, #decide-llm {
      display: block;
      margin: 2em auto 1em auto;
      background: #6f8cff;
      color: white;
      border: none;
      padding: 1em 2em;
      font-size: 1.13em;
      border-radius: 7px;
      cursor: pointer;
      box-shadow: 0 1px 6px #bfcfff3e;
      transition: background 0.2s;
    }
    #analyze-llm:disabled, #decide-llm:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    #decisionSection, #llmAnalysisSection {
      max-width:800px; margin:2em auto;background:#fff;padding:1.5em;border-radius:8px;border:1px solid #e5e7fa;
      font-size:1.11em; box-shadow:0 2px 16px #bfcfff26;
    }
    .spinner {
      display:inline-block;width:1.4em;height:1.4em;border:.24em solid #c5cafd;border-top:.24em solid #6f8cff;border-radius:50%;animation:spin .9s linear infinite;vertical-align:middle
    }
    @keyframes spin {to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <h1>User Researcher: Metadata Analyzer</h1>
  <div id="status">Initializing...</div>
  <div id="results"></div>

  <button id="analyze-llm" disabled>Ask LLM for insights on my activity</button>
  
  <section id="llmAnalysisSection" style="display:none"></section>

  <section id="decisionSection" style="display:none">
    <h2>Decision Helper</h2>
    <p>Select the ideas/records you are interested in, then click the button below to ask for LLM guidance on what to work on next.</p>
    <button id="decide-llm">Ask LLM: What should I work on next?</button>
    <div id="llmDecisionFeedback" style="margin-top:1.1em"></div>
  </section>

  <script type="module" src="./main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
